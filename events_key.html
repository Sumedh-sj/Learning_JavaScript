<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- // onresize, onscroll, onkeypress -->
<body onresize = "helloFun()">
    <button onclick = "helloFun()">Single Click</button>
    <button ondblclick = "helloFun()">Double Click</button>
    <button oncontextmenu = "helloFun()">Right Click</button>
    <button onmouseenter = "helloFun()">Mouse Enter</button>
    <button onmouseleave = "helloFun()">Mouse Leave</button>
    <script>
        function helloFun(){
            alert("Hello Darshan");
        }
    </script>
</body>
</html>
